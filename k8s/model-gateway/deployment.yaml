apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: model-gateway
  labels:
    app: model-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
    spec:
      serviceAccountName: model-gateway-sa
      containers:
        - name: model-gateway
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: model-gateway
spec:
  type: ClusterIP
  selector:
    app: model-gateway
  ports:
    - port: 8081
      targetPort: 8081
